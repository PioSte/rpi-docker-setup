# private data stored in the .env file
volumes:
  etc_wireguard:

services:
  duckdns:
    image: linuxserver/duckdns:latest
    container_name: duckdns
    # network_mode: host # needed for ipv6
    environment:
      - PUID=${PUID_piotr} #optional
      - PGID=${PGID_users} #optional
      - TZ=Europe/Warsaw
      - SUBDOMAINS=${duckdns_subdomains}
      - TOKEN=${duckdns_token}
      # - UPDATE_IP=ipv6 #both
      - LOG_FILE=false #optional
    # labels:
    #   com.centurylinklabs.watchtower.enable: "true" # update with Watchtower
    restart: unless-stopped
  mariadb:
    image: linuxserver/mariadb:latest
    container_name: nextclouddb
    environment:
      - PUID=${PUID_piotr}
      - PGID=${PGID_users}
      - MYSQL_ROOT_PASSWORD=${mysql_root_password}
      - TZ=Europe/Warsaw
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${mysql_user}
      - MYSQL_PASSWORD=${mysql_password}
    volumes:
      - /mnt/RAID5/appdata/Nextcloud/database:/config
    ports:
      - 3306:3306 #external:internal
    labels:
      com.centurylinklabs.watchtower.enable: "true" # update with Watchtower
    restart: unless-stopped
  nextcloud:
    # image: lscr.io/linuxserver/nextcloud:latest
    image: registry.gitlab.com/linuxserver.io/docker-nextcloud/nextcloud:30.0.11-previous
    container_name: nextcloud
    environment:
      # - PUID=1000 # ${PUID_piotr}
      - PUID=${PUID_piotr}
      - PGID=${PGID_users}
      - TZ=Europe/Warsaw
    volumes:
      - /mnt/RAID5/appdata/Nextcloud/config:/config
      - /mnt/RAID5/appdata/Nextcloud/data:/data
    depends_on:
      - mariadb
    ports:
      - 446:443 #external:internal, used to be 445:443
      - 82:80 #external:internal
    labels:
      com.centurylinklabs.watchtower.enable: "true" # update with Watchtower
    restart: unless-stopped
  # swag: # previously 'letsencrypt'
  #   image: lscr.io/linuxserver/swag:latest
  #   container_name: swag
  #   cap_add:
  #     - NET_ADMIN
  #   environment:
  #     - STAGING=false #change to false after done testing
  #     - PUID=${PUID_piotr} #change PUID if needed
  #     - PGID=${PGID_users}  #change PGID if needed
  #     - TZ=Europe/Warsaw # change Time Zone if needed
  #     - URL=${letsencrypt_url} #insert your domain name - yourdomain.url
  #     - SUBDOMAINS=www,nextcloud,qbittorrent
  #     - VALIDATION=http
  #     - EMAIL=${email} # define email; required to renew certificate
  #   volumes:
  #     - /mnt/RAID5/appdata/letsencrypt:/config  #/srv/dev-disk-by-label-disk1 needs to be adjusted
  #   ports:
  #     - 443:443 #external:internal
  #     - 80:80 #external:internal
  #   # labels:
  #   #   com.centurylinklabs.watchtower.enable: "true" # update with Watchtower
  #   restart: unless-stopped
  plex:
    # if CPU usage is too high, changed to 'bionic' instead of 'latest'
    # https://github.com/linuxserver/docker-plex/issues/248#issuecomment-733955977
    image: linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=${PUID_piotr}
      - PGID=${PGID_users}
      - UMASK_SET=002
      - VERSION=docker
    volumes:
      - /mnt/RAID5/appdata/plex/:/config
      - /mnt/RAID5/read-write-share/Seriale/:/tv
      - /mnt/RAID5/read-write-share/Filmy/:/movies
      - /mnt/RAID5/read-write-share/Muzyka/:/music
    devices:
      - /dev/dri:/dev/dri
    network_mode: host
    restart: unless-stopped
  pihole:
    image: pihole/pihole:2025.05.0
    ports: # (external:internal/protocol)
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "8080:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      - "8443:443/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      TZ: Europe/Warsaw
      FTLCONF_webserver_api_password: ${pihole_webpassword}
      FTLCONF_dns_upstreams: 1.1.1.1;1.0.0.1;9.9.9.9;149.112.112.112
      FTLCONF_dns_listeningMode: all
    volumes:
      - /mnt/RAID5/appdata/pihole/etc-pihole/:/etc/pihole/
      - /mnt/RAID5/appdata/pihole/etc-dnsmasq.d/:/etc/dnsmasq.d/
    # labels:
    #   com.centurylinklabs.watchtower.enable: "false" # update with Watchtower
    restart: unless-stopped
  # syncthing:
  #   image: lscr.io/linuxserver/syncthing:latest
  #   container_name: syncthing
  #   # hostname: syncthing #optional
  #   environment:
  #     - PUID=${PUID_piotr}
  #     - PGID=${PGID_users}
  #     - TZ=Europe/Warsaw
  #   volumes:
  #     - /mnt/RAID5/appdata/syncthing:/config
  #     - /mnt/RAID5/read-write-share/SyncthingData/PS/Zdjecia/OnePlus13/:/Zdjecia_OnePlus13_PS
  #     # - /path/to/data2:/data2
  #   ports:
  #     - 8384:8384
  #     - 22000:22000/tcp
  #     - 22000:22000/udp
  #     - 21027:21027/udp
  #   restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID_piotr}
      - PGID=${PGID_users}
      - TZ=Europe/Warsaw
      - JELLYFIN_PublishedServerUrl=http://192.168.0.5 #optional
    volumes:
      # - /mnt/RAID5/appdata/plex/:/config
      - /mnt/RAID5/read-write-share/Seriale/:/data/tvshows
      - /mnt/RAID5/read-write-share/Filmy/:/data/movies
      - /mnt/RAID5/read-write-share/Muzyka/:/data/music
      - /mnt/RAID5/read-write-share/metube/bbosss1/:/data/bbosss1
      - /mnt/RAID5/read-write-share/metube/PS/:/data/PS
      - /mnt/RAID5/read-write-share/Kasety:/data/Kasety
      - /mnt/RAID5/appdata/jellyfin/:/config
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    restart: unless-stopped
  
  metube:
    image: ghcr.io/alexta69/metube
    container_name: metube
    restart: unless-stopped
    environment:
      - UID=${PUID_piotr}
      - GID=${PGID_users}
      - DELETE_FILE_ON_TRASHCAN=true
    ports:
      - "8081:8081"
    volumes:
      - /mnt/RAID5/read-write-share/metube/bbosss1/:/downloads/bbosss1
      - /mnt/RAID5/read-write-share/metube/PS/:/downloads/PS

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID_piotr}
      - PGID=${PGID_users}
      - TZ=Europe/Warsaw
      - WEBUI_PORT=8090
      - TORRENTING_PORT=6881
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /mnt/RAID5/appdata/:/config
      - /mnt/RAID5/read-write-share/Downloads-qBittorrent-Container:/Downloads #optional
      - /mnt/RAID5/read-write-share/Seriale/:/Seriale
      - /mnt/RAID5/read-write-share/Filmy/:/Filmy
      - /mnt/RAID5/read-write-share/Muzyka/:/Muzyka
    ports:
      - 8090:8090
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped